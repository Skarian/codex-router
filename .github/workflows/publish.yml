name: Package and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.16.0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw Error("Release tag must match package.json version");'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm test
      - name: Verify package installation
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/router-install" --omit=dev "$RUNNER_TEMP"/skarian-codex-router-*.tgz
          touch "$RUNNER_TEMP/router-empty.toml"
          test "$("$RUNNER_TEMP/router-install/bin/codex-router" --config "$RUNNER_TEMP/router-empty.toml" agents list --json)" = '[]'

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm publish --access public --provenance --tag latest
